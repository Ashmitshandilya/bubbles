# Bubbles home LLM door (installed by setup.sh; __TOKEN__ and __PORT__ are filled in there).
# Listens on this machine only; Tailscale Funnel publishes it over https. Only the one chat endpoint exists, only with the token.
limit_req_zone $server_name zone=bubbles_llm:1m rate=30r/m;

server {
    listen 127.0.0.1:__PORT__;
    server_name bubbles-llm;

    # Never keep request details (they can be health prompts).
    access_log off;
    client_max_body_size 256k;

    location = /v1/chat/completions {
        if ($http_authorization != "Bearer __TOKEN__") {
            return 401;
        }
        limit_req zone=bubbles_llm burst=10 nodelay;
        limit_except POST { deny all; }

        proxy_pass http://127.0.0.1:11434;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:11434;
        proxy_set_header Authorization "";
        proxy_set_header Origin "";
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
