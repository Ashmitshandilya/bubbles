name: Tests

# Runs the same checks that are run before every release: server tests, and for the website the type check, lint, tests and a production build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # requirements.txt is a complete list of exact versions, so it is installed without a second resolve (google-genai asks for websockets below 17 while the list pins 17.2)
      - run: pip install --no-deps -r requirements.txt
      - run: pip install --no-deps iniconfig==2.3.0 pluggy==1.6.0 Pygments==2.21.0 pytest==9.1.1
      - run: python -m pytest tests -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build
